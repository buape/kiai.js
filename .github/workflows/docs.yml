name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "typedoc.json"
      - "typedoc-formatter.mjs"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kiai.js
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Generate Documentation
        run: bun run typedoc

      - name: Checkout kiai-docs
        uses: actions/checkout@v7
        with:
          repository: buape/kiai-docs
          token: ${{ secrets.BUAPEBOT_SECRET }}
          path: kiai-docs
          ref: v2

      - name: Copy Documentation
        run: |
          rm -rf kiai-docs/content/kiai.js
          mkdir -p kiai-docs/content/kiai.js
          cp -r docs/* kiai-docs/content/kiai.js/
          printf '{\n\t"defaultOpen": false\n}\n' > kiai-docs/content/kiai.js/meta.json

      - name: Create documentation PR
        env:
          GH_TOKEN: ${{ secrets.BUAPEBOT_SECRET }}
        run: |
          cd kiai-docs
          git config user.name "BuapeBot"
          git config user.email "buapestudios@gmail.com"
          git switch -C automation/kiai-js-docs
          git add .
          if git diff --cached --quiet; then
            echo "Documentation is already up to date"
            exit 0
          fi
          git commit -m "docs: update kiai.js documentation from kiai.js@${{ github.sha }}"
          git push --force origin automation/kiai-js-docs

          pr=$(gh api repos/buape/kiai-docs/pulls --method GET -f state=open -f head=buape:automation/kiai-js-docs -f base=v2 --jq '.[0].number // ""')
          if [ -n "$pr" ]; then
            gh api "repos/buape/kiai-docs/pulls/$pr" --method PATCH -f title="docs: update kiai.js documentation" -f body="Automated documentation update from kiai.js@${{ github.sha }}."
          else
            gh api repos/buape/kiai-docs/pulls --method POST -f title="docs: update kiai.js documentation" -f head=buape:automation/kiai-js-docs -f base=v2 -f body="Automated documentation update from kiai.js@${{ github.sha }}."
          fi
